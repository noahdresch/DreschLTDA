<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <p:megaMenu id="#{empty menuId ? 'appMegaMenu' : menuId}"
                orientation="vertical"
                styleClass="app-mega-menu">
        <p:menuitem value="Início"
                    outcome="/index"
                    icon="pi pi-home"
                    styleClass="#{navigationController.isActive('inicio') ? 'app-menu-item-active' : ''}"/>
        <p:menuitem value="Empresas"
                    outcome="/pages/empresas"
                    icon="pi pi-building"
                    styleClass="#{navigationController.isActive('empresas') ? 'app-menu-item-active' : ''}"/>
    </p:megaMenu>

</ui:composition>
